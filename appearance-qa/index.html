<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外观设置预览 · 成绩轨迹</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:#21364b;font:14px/1.5 system-ui}header{background:#fff;border-bottom:1px solid #d9e3ef;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header>b{margin-right:8px}label{display:flex;align-items:center;gap:6px}select{font:inherit;padding:6px;border:1px solid #d4dfeb;border-radius:8px;background:#fff;color:inherit}header small{color:#65758a}main{padding:20px;width:max-content;min-width:100%}iframe{display:block;border:1px solid #c6d7e8;border-radius:18px;background:#fff;box-shadow:0 18px 55px #24445f16;margin:auto}@media(max-width:620px){header{padding:12px;gap:9px;font-size:12px}header>b{width:100%}main{padding:12px}}</style>
<header><b>成绩轨迹 · 外观预览</b>
<label>页面<select id="page"><option value="appearance">外观设置</option><option value="account">完整账号页</option><option value="home">概览</option><option value="records">考试记录</option><option value="stats">分析</option><option value="editor">考试录入</option></select></label>
<label>尺寸<select id="viewport"><option value="390,844">手机 390</option><option value="320,740">窄屏 320</option><option value="430,932">大屏手机 430</option><option value="768,1024">平板 768</option><option value="1280,900">桌面 1280</option></select></label>
<label>成套主题<select id="preset"><option value="">自由搭配</option><option value="cloud">云间天蓝</option><option value="notebook">方格笔记</option><option value="garden">薄荷花园</option><option value="dawn">晨光奶油</option><option value="night">星河夜读</option><option value="journal">复古手账</option></select></label>
<label>基础配色<select id="theme"><option value="sky">天蓝</option><option value="sunny">晴白</option><option value="paper">暖纸</option><option value="sakura">樱粉</option><option value="violet">淡紫</option><option value="mint">青屿</option><option value="night">墨夜</option></select></label>
<label>正文<select id="font"><option value="system">系统默认</option><option value="sans">清晰黑体</option><option value="serif">书卷宋体</option><option value="wenkai">霞鹜文楷</option><option value="fangsong">朱雀仿宋</option></select></label>
<label>字号<select id="size"><option value="standard">标准</option><option value="compact">小字</option><option value="large">大字</option></select></label>
<small>合成数据 · 不连接真实账号</small></header><main><iframe id="preview" title="外观和设置预览" width="390" height="844"></iframe></main>
<script>
const f=document.getElementById('preview'),controls=['page','theme','font','size','preset'].map(id=>document.getElementById(id));
const p=new URLSearchParams(location.search);let carry=null,loading=true;f.addEventListener('load',()=>{loading=false;});
try{carry=JSON.parse(p.get('look')||'null')}catch(e){}
controls.forEach(el=>{if(p.has(el.id)&&[...el.options].some(o=>o.value===p.get(el.id)))el.value=p.get(el.id)});
function reload(event){
 if(!loading)try{const latest=f.contentWindow.localStorage.getItem('st_studio_v1');if(latest)carry=JSON.parse(latest)}catch(e){}
 const id=event&&event.target.id;
 if(id==='preset')carry=null;
 if(id==='theme'){document.getElementById('preset').value='';if(carry){carry.theme='';carry.palette=document.getElementById('theme').value;}}
 if((id==='font'||id==='size')&&carry){carry.reading=carry.reading||{font:document.getElementById('font').value,size:document.getElementById('size').value};carry.reading[id]=document.getElementById(id).value;}
 const q=new URLSearchParams(Object.fromEntries(controls.map(el=>[el.id,el.value])));
 if(carry){q.set('look',JSON.stringify(carry));q.delete('preset');}
 if(document.getElementById('page').value==='appearance')q.set('studio','1');
 loading=true;f.src='/appearance-qa/frame.html?'+q;history.replaceState(null,'','?'+q);
}
controls.forEach(el=>el.onchange=reload);
const view=document.getElementById('viewport');function size(){let[w,h]=view.value.split(',');f.width=w;f.height=h;}view.onchange=size;
if(innerWidth<620){const value=Math.max(280,innerWidth-24)+','+Math.max(600,innerHeight-100);const option=new Option('当前屏幕',value);view.add(option);view.value=value;}
size();reload();
</script></html>
