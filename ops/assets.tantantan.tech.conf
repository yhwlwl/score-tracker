# Public images and a restricted preview upload relay on this host only.
limit_conn_zone $binary_remote_addr zone=st_assets_ip:1m;
limit_conn_zone $server_name zone=st_assets_all:1m;
limit_req_zone $binary_remote_addr zone=st_assets_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=st_paper_preview_ip:1m;
limit_conn_zone $server_name zone=st_paper_preview_all:1m;
limit_req_zone $binary_remote_addr zone=st_paper_preview_requests:1m rate=3r/s;
server {
    listen 80;
    server_name assets.tantantan.tech;
    root /www/wwwroot/score-tracker-assets;
    access_log off;
    autoindex off;
    disable_symlinks on;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://assets.tantantan.tech$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name assets.tantantan.tech;
    ssl_certificate /www/server/score-tracker-assets-acme/live/fullchain.pem;
    ssl_certificate_key /www/server/score-tracker-assets-acme/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ST_ASSETS_TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    root /www/wwwroot/score-tracker-assets;
    autoindex off;
    disable_symlinks on;
    access_log off;
    error_log /www/wwwlogs/score-tracker-assets.error.log crit;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 15s;
    gzip off;
    max_ranges 1;
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'none'; img-src data:; sandbox" always;
    location ~ "^/v1/[a-f0-9]{16}/[A-Za-z0-9][A-Za-z0-9_-]*\.(png|jpe?g|webp|svg)$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_conn st_assets_ip 6;
        limit_conn st_assets_all 12;
        limit_conn_status 429;
        limit_req zone=st_assets_requests burst=40 nodelay;
        limit_req_status 429;
        limit_rate 256k;
        try_files $uri =404;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; img-src data:; sandbox" always;
    }
    # Only this preview relay accepts bodies; private images stay outside the public root.
    location = /paper-preview-upload {
        limit_conn st_paper_preview_ip 3;
        limit_conn st_paper_preview_all 8;
        limit_conn_status 429;
        limit_req zone=st_paper_preview_requests burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 3900000;
        client_body_buffer_size 4m;
        client_body_timeout 25s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_next_upstream off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18765;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 404;
    }
}
