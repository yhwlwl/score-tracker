<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>题型录分 · 视觉验收</title><style>body{margin:0;background:#e9edf3;font:14px system-ui;color:#253044}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:white}select{font:inherit;padding:7px}main{padding:16px;width:fit-content;min-width:calc(100% - 32px)}iframe{display:block;border:1px solid #ccd2db;margin:auto;background:white}small{color:#667085}</style><header><b>题型录分</b><select id="page" aria-label="页面"><option value="editor">录入</option><option value="detail">考试详情</option></select><select id="size" aria-label="尺寸"><option value="390,844">手机 390 × 844</option><option value="320,740">窄屏 320 × 740</option><option value="768,1024">平板 768 × 1024</option><option value="1280,900">桌面 1280 × 900</option></select><select id="theme" aria-label="主题"><option value="sunny">浅色</option><option value="night">深色</option></select><small>合成数据 · 请求已模拟</small></header><main><iframe id="preview" title="题型录分预览" width="390" height="844" src="frame.html"></iframe></main><script>const f=document.querySelector('#preview');document.querySelector('#size').onchange=function(){let[w,h]=this.value.split(',');f.width=w;f.height=h};for(const id of ['page','theme'])document.getElementById(id).onchange=function(){f.src='frame.html?page='+document.getElementById('page').value+'&theme='+document.getElementById('theme').value};</script></html>
