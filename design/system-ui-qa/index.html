<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>全站视觉验收 · 合成数据</title><style>body{margin:0;background:#e7ebf2;color:#253044;font:14px system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#fff}select{font:inherit;padding:7px;max-width:210px}small{color:#657184}main{padding:16px;width:fit-content;min-width:calc(100% - 32px)}iframe{display:block;background:white;border:1px solid #c4cbd6;margin:auto;box-shadow:0 8px 28px #18212f12}</style><header><b>全站视觉验收</b><label>页面 <select id="page"><option value="home">概览</option><option value="records">考试记录</option><option value="detail">考试详情</option><option value="stats">统计分析</option><option value="account">账号与设置</option><option value="editor">考试录入弹窗</option><option value="login">登录</option><option value="recovery">账号找回</option><option value="admin">管理后台</option></select></label><label>尺寸 <select id="size"><option value="390,844">手机 390 × 844</option><option value="320,740">窄屏 320 × 740</option><option value="768,1024">平板 768 × 1024</option><option value="1024,768">横屏 1024 × 768</option><option value="1280,900">桌面 1280 × 900</option></select></label><label>主题 <select id="theme"><option value="sunny">晴白</option><option value="night">夜色</option><option value="paper">暖纸</option><option value="sakura">樱粉</option><option value="violet">淡紫</option><option value="mint">青屿</option></select></label><small>合成数据 · 全部请求模拟 · 不读取登录凭证</small></header><main><iframe id="preview" title="全站预览" width="390" height="844" src="frame.html?page=home"></iframe></main><script>const p=document.querySelector('#page'),s=document.querySelector('#size'),t=document.querySelector('#theme'),f=document.querySelector('#preview');function reload(){f.src=(p.value==='admin'?'admin.html?view=overview':'frame.html?page='+p.value)+'&theme='+t.value}p.onchange=t.onchange=reload;s.onchange=function(){let[w,h]=s.value.split(',');f.width=w;f.height=h};</script></html>
