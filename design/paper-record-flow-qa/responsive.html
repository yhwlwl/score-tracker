<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>试卷复盘 · 多尺寸预览</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f8;color:#23304b;font:14px/1.6 system-ui}header{position:sticky;top:0;background:#fff;padding:12px 18px;z-index:2;border-bottom:1px solid #d7deeb;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 10px 0 0}button{padding:8px 12px;background:#fff;border:1px solid #ccd6e6;border-radius:8px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e6efff;color:#2458a8;border-color:#4a79c3}main{padding:18px;overflow:auto}iframe{display:block;margin:auto;border:1px solid #cad5e6;border-radius:16px;background:white;height:900px}a{color:#2458a8}</style><header><h1>试卷复盘 · 多尺寸预览</h1><button data-width="390" aria-pressed="true">手机 390</button><button data-width="320" aria-pressed="false">窄屏 320</button><button data-width="768" aria-pressed="false">平板 768</button><button data-width="1280" aria-pressed="false">桌面 1280</button><a href="./">直接打开演示</a></header><main><iframe title="试卷复盘演示" src="./" style="width:390px"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(function(b){b.onclick=function(){document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});};});</script></html>
