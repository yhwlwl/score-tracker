<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>考试详情 · 视觉验收（合成数据）</title><style>body{margin:0;background:#dfe4ec;color:#1d2939;font:14px system-ui}header{padding:12px 20px;display:flex;gap:18px;align-items:center;background:white}select,button{font:inherit;padding:7px}main{padding:16px;width:fit-content;min-width:calc(100% - 32px)}iframe{display:block;border:1px solid #bcc5d3;margin:auto;background:white;box-shadow:0 8px 30px #10182815}small{color:#667085}</style><header><b>考试详情 · 视觉验收</b><label>尺寸 <select id="size"><option value="390,844">手机 390 × 844</option><option value="320,740">窄屏手机 320 × 740</option><option value="768,1024">平板竖屏 768 × 1024</option><option value="1024,768">平板横屏 1024 × 768</option><option value="1280,900">桌面 1280 × 900</option></select></label><label>主题 <select id="theme"><option value="sunny">浅色</option><option value="night">深色</option></select></label><small>本地合成数据，不连接生产服务</small></header><main><iframe id="preview" title="考试详情预览" width="390" height="844" src="frame.html"></iframe></main><script>size.onchange=function(){let [w,h]=size.value.split(',');preview.width=w;preview.height=h};theme.onchange=function(){preview.src='frame.html?theme='+theme.value};</script></html>
