<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原图核对 · 合成资料验收</title><style>
:root{--accent:#5269d8;--accent-soft:#eef2ff;--text:#263247;--muted:#6f7c8e;--line:#e1e7f0;--panel-solid:#fff;--soft:#f5f7fb;--danger:#ad4949}*{box-sizing:border-box}body{margin:0;padding:24px;background:#fafbfe;color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto}.pr-button{font:inherit;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel-solid);color:var(--text);cursor:pointer}.pr-primary{background:var(--accent);border-color:var(--accent);color:white}.pr-button:disabled{opacity:.5;cursor:default}.pr-question{padding:12px;border:1px solid var(--line);margin:10px 0}.pr-question label{display:inline-grid;gap:4px;margin:5px}.pr-question input{max-width:100px}.pr-record-overview{display:none}body>p{max-width:1180px;margin:0 auto;font-size:12px;color:var(--muted)}@media(max-width:520px){body{padding:10px}}
</style><body><p>交互验收 · 全部为合成图片与示例分数，不连接任何账号</p><main><div class="pr-result-top"></div><div class="pr-record-overview"></div><section data-report-section="questions"></section></main>
<script>function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script><script src="../paper-review-board.js"></script><script src="../paper-records.js"></script><script>
(function(){
 const main=document.querySelector('main');
 function pageImage(work,n){let parts='<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="white"/><g fill="#333b46" font-family="serif" font-size="21"><text x="500" y="65" text-anchor="middle">高二数学 · '+(work?'答题卡':'试卷')+'（示例）</text><path d="M50 95H950" stroke="#ccd2db"/>';if(work){parts+='<text x="70" y="145">三、填空题（每题5分，共15分）</text><text x="70" y="203">12.　1 / 2　　13.　6x − 7y + 43 = 0　　14.　√6</text><text x="840" y="145" fill="#b94e4c" font-size="27">10分</text>';[15,16].forEach((q,i)=>{let x=70+i*470;parts+='<rect x="'+(x-10)+'" y="280" width="435" height="410" fill="none" stroke="#b7bfc8"/><text x="'+x+'" y="315">'+q+'.（'+(i?15:13)+'分）</text><text x="'+(x+285)+'" y="320" fill="#b94e4c" font-size="27">'+(i?11:10)+'分</text><text x="'+x+'" y="385">解：由题意可得，</text><text x="'+(x+20)+'" y="450" font-style="italic">'+(i?'P = 8 / 20 = 2 / 5':'m² − 2m = 0')+'</text><text x="'+(x+20)+'" y="515">'+(i?'故所求概率为 2 / 5。':'∴ m = 0 或 m = 2。')+'</text>';});}else{[12,13,14,15,16].forEach((q,i)=>{let y=135+i*118;parts+='<text x="70" y="'+y+'">'+q+'. '+(q<15?'填空题：根据题目条件完成填空。':'已知函数与相关条件，回答下列问题。')+'</text><text x="100" y="'+(y+43)+'" font-size="18">'+(q<15?'本题满分 5 分':'（1）求参数范围；（2）证明所给结论。')+'</text><path d="M70 '+(y+77)+' H930" stroke="#e5e8ec"/>';});}return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(parts+'</g></svg>');}
 const labels=['12','13','14','15','16'],qs=labels.map((label,i)=>({id:label,label,stem:'原题见截图',answer:'',screenshot_only:true,question_type:i<3?'填空题':'解答题',teacher_score:i<3?null:i===3?10:11,max_score:i<3?5:i===3?13:null,confidence:'high',uncertainties:[],pages:[1],work_pages:[2],work_expected:true,source_regions:[{kind:'paper',page:1,box:[.055,.14+i*.155,.89,.14]},{kind:'work',page:2,box:i<3?[.055,.14,.89,.18]:i===3?[.055,.36,.435,.55]:[.525,.36,.435,.55]}],score_mark:i>=3?{page:2,quote:i===3?'10分':'11分'}:null,type_total:i<3?{label:'填空题',score:10,max:15}:undefined}));
 const row={request_id:'synthetic',status:'succeeded',revision:0,corrections:[],result:{screenshot_only:true,questions:qs,score_groups:[{label:'填空题',questions:['12','13','14'],teacher_score:10,max_score:15}]}};
 main.querySelector('[data-report-section=questions]').innerHTML=qs.map(q=>'<article class="pr-question" data-question="'+q.id+'"><b>第 '+q.label+' 题</b>'+['question_type','teacher_score','max_score'].map(k=>'<label>'+k+'<input data-field="'+k+'" '+(k==='question_type'?'':'type="number"')+' value="'+(q[k]??'')+'"></label>').join('')+'<label><input type="checkbox" data-field="verified">已核对</label></article>').join('');
 const source={pages:[{page:1,role:'paper',url:pageImage(false,1)},{page:2,role:'work',url:pageImage(true,2)}]},ctx={};
 const hooks={regions:async updates=>{updates.forEach(u=>{qs.find(q=>q.label===u.label).source_regions=u.regions;});},save:async()=>{await main.paperBoardBeforeSave();row.corrections=qs.map(q=>{const n=main.querySelector('[data-question="'+q.id+'"]');let c={id:q.id,type_total:n.dataset.groupTotal?JSON.parse(n.dataset.groupTotal):undefined};['question_type','teacher_score','max_score','verified'].forEach(k=>{const el=n.querySelector('[data-field='+k+']');c[k]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value;});return c;});row.revision++;main.querySelector('.pb-board [data-pb-status]').textContent='示例核对已保存';}};
 window.ScorePaperBoard.mount(main,row,ctx,source,hooks);
})();</script></body></html>
