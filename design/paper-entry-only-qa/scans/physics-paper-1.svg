<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870"><rect width="1000" height="870" fill="white"/><text x="40" y="48" font-size="28" fill="#26334c" font-family="sans-serif">物理 · 模拟原题扫描页</text><text x="40" y="86" font-size="18" fill="#7b879a" font-family="sans-serif">合成演示资料，无真实姓名、考号或成绩</text><rect x="30" y="120" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="154" fill="#24324a" font-size="24" font-family="sans-serif">第 1 题 · 单选题</text><text x="48" y="196" fill="#24324a" font-size="22" font-family="sans-serif">物体由静止开始做匀加速直线运动，加速度为2m/s²，3s后的速度为（ ）</text><text x="48" y="228" fill="#24324a" font-size="22" font-family="sans-serif"> A.2m/s B.3m/s C.6m/s D.9m/s</text><rect x="30" y="290" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="324" fill="#24324a" font-size="24" font-family="sans-serif">第 2 题 · 单选题</text><text x="48" y="366" fill="#24324a" font-size="22" font-family="sans-serif">质量为2kg的物体受到大小为6N的水平合力，则加速度为（ ） A.2m/</text><text x="48" y="398" fill="#24324a" font-size="22" font-family="sans-serif">s² B.3m/s² C.6m/s² D.12m/s²</text><rect x="30" y="460" width="940" height="190" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="494" fill="#24324a" font-size="24" font-family="sans-serif">第 3 题 · 多选题</text><text x="48" y="536" fill="#24324a" font-size="22" font-family="sans-serif">关于机械能，下列说法正确的是（ ） A.动能与速率平方成正比 B.重力势</text><text x="48" y="568" fill="#24324a" font-size="22" font-family="sans-serif">能与零势能面选择无关 C.只有重力做功时机械能守恒 D.摩擦力一定使系统</text><text x="48" y="600" fill="#24324a" font-size="22" font-family="sans-serif">机械能增加</text><rect x="30" y="660" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="694" fill="#24324a" font-size="24" font-family="sans-serif">第 4 题 · 多选题</text><text x="48" y="736" fill="#24324a" font-size="22" font-family="sans-serif">关于匀速圆周运动，下列说法正确的是（ ） A.速率不变 B.速度不变 C</text><text x="48" y="768" fill="#24324a" font-size="22" font-family="sans-serif">.向心力指向圆心 D.加速度为零</text></svg>