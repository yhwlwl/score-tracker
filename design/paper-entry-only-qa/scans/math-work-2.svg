<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><rect width="1000" height="840" fill="white"/><text x="40" y="48" font-size="28" fill="#26334c" font-family="sans-serif">数学 · 模拟答题卡作答页</text><text x="40" y="86" font-size="18" fill="#7b879a" font-family="sans-serif">合成演示资料，无真实姓名、考号或成绩</text><rect x="30" y="120" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="154" fill="#24324a" font-size="24" font-family="sans-serif">第 5 题 · 多选题</text><text x="940" y="154" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">3 / 6 分</text><text x="48" y="196" fill="#294b94" font-size="22" font-family="sans-serif">AB</text><rect x="30" y="290" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="324" fill="#24324a" font-size="24" font-family="sans-serif">第 6 题 · 填空题</text><text x="940" y="324" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">6 / 6 分</text><text x="48" y="366" fill="#294b94" font-size="22" font-family="sans-serif">29</text><rect x="30" y="460" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="494" fill="#24324a" font-size="24" font-family="sans-serif">第 7 题 · 解答题</text><text x="940" y="494" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">批改分待确认</text><text x="48" y="536" fill="#294b94" font-size="22" font-family="sans-serif">（1）x=1或3。（2）f(x)=(x−2)²−1，最小值为−1。</text><rect x="30" y="630" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="664" fill="#24324a" font-size="24" font-family="sans-serif">第 8 题 · 解答题</text><text x="940" y="664" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">10 / 16 分</text><text x="48" y="706" fill="#294b94" font-size="22" font-family="sans-serif">f′(x)=3x²−3。令导数为0，得x=±1。在(−∞,−1)与(1,</text><text x="48" y="738" fill="#294b94" font-size="22" font-family="sans-serif">+∞)上递增，在(−1,1)上递减。</text></svg>