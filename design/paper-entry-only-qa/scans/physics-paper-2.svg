<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><rect width="1000" height="840" fill="white"/><text x="40" y="48" font-size="28" fill="#26334c" font-family="sans-serif">物理 · 模拟原题扫描页</text><text x="40" y="86" font-size="18" fill="#7b879a" font-family="sans-serif">合成演示资料，无真实姓名、考号或成绩</text><rect x="30" y="120" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="154" fill="#24324a" font-size="24" font-family="sans-serif">第 5 题 · 实验题</text><text x="48" y="196" fill="#24324a" font-size="22" font-family="sans-serif">用打点计时器研究匀变速直线运动，两个计数点间的时间间隔为0.10s，相邻</text><text x="48" y="228" fill="#24324a" font-size="22" font-family="sans-serif">两段位移分别为4.0cm和6.0cm，求加速度。</text><rect x="30" y="290" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="324" fill="#24324a" font-size="24" font-family="sans-serif">第 6 题 · 实验题</text><text x="48" y="366" fill="#24324a" font-size="22" font-family="sans-serif">伏安法测电阻时，电压表读数为3.0V，电流表读数为0.20A，求待测电阻</text><text x="48" y="398" fill="#24324a" font-size="22" font-family="sans-serif">。</text><rect x="30" y="460" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="494" fill="#24324a" font-size="24" font-family="sans-serif">第 7 题 · 解答题</text><text x="48" y="536" fill="#24324a" font-size="22" font-family="sans-serif">质量为1kg的物体从距地面5m处由静止落下，不计空气阻力，取g=10m/</text><text x="48" y="568" fill="#24324a" font-size="22" font-family="sans-serif">s²。（1）求落地速度；（2）求落地前动能。</text><rect x="30" y="630" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="664" fill="#24324a" font-size="24" font-family="sans-serif">第 8 题 · 解答题</text><text x="48" y="706" fill="#24324a" font-size="22" font-family="sans-serif">质量为2kg的物体在水平面上运动，初速度为4m/s，受到大小为4N的恒定</text><text x="48" y="738" fill="#24324a" font-size="22" font-family="sans-serif">阻力。（1）求停止时间；（2）求滑行距离。</text></svg>