<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><rect width="1000" height="840" fill="white"/><text x="40" y="48" font-size="28" fill="#26334c" font-family="sans-serif">物理 · 模拟答题卡作答页</text><text x="40" y="86" font-size="18" fill="#7b879a" font-family="sans-serif">合成演示资料，无真实姓名、考号或成绩</text><rect x="30" y="120" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="154" fill="#24324a" font-size="24" font-family="sans-serif">第 5 题 · 实验题</text><text x="940" y="154" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">4 / 8 分</text><text x="48" y="196" fill="#294b94" font-size="22" font-family="sans-serif">a=(0.06−0.04)/(0.10)²=2.0m/s²。</text><rect x="30" y="290" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="324" fill="#24324a" font-size="24" font-family="sans-serif">第 6 题 · 实验题</text><text x="940" y="324" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">批改分待确认</text><text x="48" y="366" fill="#294b94" font-size="22" font-family="sans-serif">R=U/I=15Ω。</text><rect x="30" y="460" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="494" fill="#24324a" font-size="24" font-family="sans-serif">第 7 题 · 解答题</text><text x="940" y="494" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">7 / 10 分</text><text x="48" y="536" fill="#294b94" font-size="22" font-family="sans-serif">v²=2gh=100，v=10m/s；动能为50J。</text><rect x="30" y="630" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="664" fill="#24324a" font-size="24" font-family="sans-serif">第 8 题 · 解答题</text><text x="940" y="664" text-anchor="end" fill="#be4545" font-size="23" font-family="sans-serif">10 / 14 分</text><text x="48" y="706" fill="#294b94" font-size="22" font-family="sans-serif">a=F/m=2m/s²，t=v₀/a=2s；s=v₀t−at²/2=4m</text><text x="48" y="738" fill="#294b94" font-size="22" font-family="sans-serif">。</text></svg>