<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><rect width="1000" height="840" fill="white"/><text x="40" y="48" font-size="28" fill="#26334c" font-family="sans-serif">数学 · 模拟原题扫描页</text><text x="40" y="86" font-size="18" fill="#7b879a" font-family="sans-serif">合成演示资料，无真实姓名、考号或成绩</text><rect x="30" y="120" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="154" fill="#24324a" font-size="24" font-family="sans-serif">第 5 题 · 多选题</text><text x="48" y="196" fill="#24324a" font-size="22" font-family="sans-serif">下列函数中，在实数范围内为偶函数的是（ ） A.y=x² B.y=cos</text><text x="48" y="228" fill="#24324a" font-size="22" font-family="sans-serif"> x C.y=x³ D.y=|x|</text><rect x="30" y="290" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="324" fill="#24324a" font-size="24" font-family="sans-serif">第 6 题 · 填空题</text><text x="48" y="366" fill="#24324a" font-size="22" font-family="sans-serif">等差数列的首项为2，公差为3，则第10项为____。</text><rect x="30" y="460" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="494" fill="#24324a" font-size="24" font-family="sans-serif">第 7 题 · 解答题</text><text x="48" y="536" fill="#24324a" font-size="22" font-family="sans-serif">已知函数 f(x)=x²−4x+3。（1）求零点；（2）求函数的最小值。</text><rect x="30" y="630" width="940" height="160" rx="6" fill="white" stroke="#d7dfeb"/><text x="48" y="664" fill="#24324a" font-size="24" font-family="sans-serif">第 8 题 · 解答题</text><text x="48" y="706" fill="#24324a" font-size="22" font-family="sans-serif">已知函数 f(x)=x³−3x。（1）求导数；（2）求单调区间。</text></svg>