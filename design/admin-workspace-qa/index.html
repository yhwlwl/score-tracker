<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台与互动改进预览</title><style>body{margin:0;background:#e8ecf3;color:#23324a;font:14px system-ui}header{padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#fff}select{font:inherit;padding:7px;max-width:200px}small{color:#68758a}main{padding:16px;min-width:calc(100% - 32px);width:fit-content}iframe{display:block;margin:auto;border:1px solid #c8d0df;box-shadow:0 8px 30px #18212f14;background:white}</style><header><b>后台与互动改进预览</b><label>页面 <select id="scenario"><option value="users">用户列表</option><option value="votes">用户详情 · 具体投票</option><option value="comments">用户详情 · 公告评论</option><option value="reply">回复公告评论</option><option value="vision">图片识别记录</option><option value="settings">识图服务与额度</option><option value="activity">公告阅读与评论</option><option value="community">交流群设置</option><option value="home">首页交流群入口</option><option value="announcement">用户侧作者回复</option></select></label><label>尺寸 <select id="size"><option value="1280,900">桌面 1280 × 900</option><option value="768,1024">平板 768 × 1024</option><option value="390,844">手机 390 × 844</option><option value="320,740">窄屏 320 × 740</option></select></label><small>全部为合成数据 · 操作只作用于当前预览</small></header><main><iframe id="preview" title="功能预览" width="1280" height="900"></iframe></main><script>const s=document.querySelector('#scenario'),z=document.querySelector('#size'),f=document.querySelector('#preview');function load(){let v=s.value,view=['vision','settings'].includes(v)?'vision':v==='activity'?'notices':v==='community'?'community':'users';f.src=(['home','announcement'].includes(v)?'app.html?':'admin.html?view='+view+'&')+'scenario='+v}const q=new URLSearchParams(location.search);if(q.has('scenario'))s.value=q.get('scenario');if(q.has('size'))z.value=q.get('size');s.onchange=load;z.onchange=function(){[f.width,f.height]=z.value.split(',')};z.onchange();load();</script></html>
